name: BAKERY macOS universal
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure universal
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DBAKERY_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4 -- -quiet
      - name: Engine tests (full, incl. 10-minute long run)
        shell: bash
        run: |
          set -o pipefail
          ./build/Release/bakery_engine_tests 2>&1 | tee engine-test-log.txt
      - name: Plugin tests (JUCE processor + editor screenshots)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p shots && cd shots
          ../build/bakery_plugin_tests_artefacts/Release/bakery_plugin_tests 2>&1 | tee ../plugin-test-log.txt
      - name: Demo WAVs
        run: mkdir -p demos && ./build/Release/bakery_render_demos demos
      - name: Strip, sign, verify universal
        shell: bash
        run: |
          set -e
          for b in "build/Bakery_artefacts/Release/VST3/BAKERY.vst3" "build/Bakery_artefacts/Release/AU/BAKERY.component"; do
            strip -x "$b/Contents/MacOS/BAKERY"
            codesign --force --deep --sign - --timestamp=none "$b"
            codesign --verify --deep --strict "$b"
            lipo -info "$b/Contents/MacOS/BAKERY" | tee -a lipo.txt
            lipo "$b/Contents/MacOS/BAKERY" -verify_arch arm64 x86_64
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$b/Contents/Info.plist" | tee -a version.txt
            otool -l "$b/Contents/MacOS/BAKERY" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version" | head -2 | tee -a minos.txt
          done
      - name: pluginval VST3 strictness 10 (required)
        shell: bash
        run: |
          set -o pipefail
          curl -fLsS -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 "build/Bakery_artefacts/Release/VST3/BAKERY.vst3" 2>&1 | tee pluginval-vst3-log.txt
      - name: auval + pluginval AU (required)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Bakery_artefacts/Release/AU/BAKERY.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -a 2>&1 | grep -i -E "Bkry|BAKERY" | tee auval-list.txt
          auval -strict -v aumu Bkry Koob 2>&1 | tee auval-log.txt
          grep -q "AU VALIDATION SUCCEEDED" auval-log.txt
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 ~/Library/Audio/Plug-Ins/Components/BAKERY.component 2>&1 | tee pluginval-au-log.txt
      - name: Package
        if: success()
        run: |
          mkdir -p pkg/BAKERY
          cp -R build/Bakery_artefacts/Release/VST3/BAKERY.vst3 build/Bakery_artefacts/Release/AU/BAKERY.component pkg/BAKERY/
          cp scripts/install_mac.sh scripts/INSTALL.txt README.md LEARN.md TESTING.md pkg/BAKERY/
          chmod +x pkg/BAKERY/install_mac.sh
          cd pkg && zip -9 -r -y -q "$GITHUB_WORKSPACE/BAKERY-macOS-universal-v1.1.zip" BAKERY
          shasum -a 256 "$GITHUB_WORKSPACE/BAKERY-macOS-universal-v1.1.zip" | tee "$GITHUB_WORKSPACE/sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BAKERY-macOS-universal-v1.1
          path: |
            BAKERY-macOS-universal-v1.1.zip
            shots/*.png
            demos/*.wav
            engine-test-log.txt
            plugin-test-log.txt
            pluginval-vst3-log.txt
            pluginval-au-log.txt
            auval-log.txt
            auval-list.txt
            lipo.txt
            version.txt
            minos.txt
            sha256.txt
